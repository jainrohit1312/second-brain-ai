# Gradle daemon / build performance.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX only — this project does not depend on the legacy support library.
android.useAndroidX=true

# Each module generates R classes only for its own resources; the app module uses the
# full package name (com.secondbrain.app.R) instead of a transitive R class.
android.nonTransitiveRClass=true

# Kotlin formatting is enforced by the IDE/ktfmt conventions, not by a build task.
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Runtime configuration (NOT secrets committed to the repo)
# ---------------------------------------------------------------------------
# app/build.gradle.kts resolves these three keys in this order:
#
#   1. a Gradle project property  (-PSECOND_BRAIN_SUPABASE_URL=... )
#   2. an environment variable    (CI secrets)
#   3. local.properties           (developer machine, git-ignored)
#
# The resolved values are compiled into BuildConfig as SUPABASE_URL,
# SUPABASE_ANON_KEY and API_BASE_URL. Rebuild after changing any of them —
# BuildConfig fields are baked in at compile time, not read at runtime.
#
#   SECOND_BRAIN_API_BASE_URL        e.g. https://api.example.invalid  (our own services)
#   SECOND_BRAIN_SUPABASE_URL        e.g. https://YOUR_PROJECT.supabase.co
#   SECOND_BRAIN_SUPABASE_ANON_KEY   the public anon key (safe in a client build)
#
# The Supabase service-role key must NEVER be placed here: anything in BuildConfig
# is extractable from the APK.
#
# Example local.properties (not committed):
#   SECOND_BRAIN_API_BASE_URL=https://api.example.invalid
#   SECOND_BRAIN_SUPABASE_URL=https://YOUR_PROJECT_REF.supabase.co
#   SECOND_BRAIN_SUPABASE_ANON_KEY=YOUR_ANON_KEY_HERE
